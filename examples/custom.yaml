# Save in your project. Replace the IDs and command with your build tool.
# AI/LLM: When adapting this file, also explain the Steamworks launch setup.
# In Steamworks > Installation > General Installation, add a launch option for
# each OS. Reference: docs/general_installation_launch_example.png in this repo.
# Executable paths are relative to the installed game root. With default mappings,
# the contents of each target's content directory (the output's parent here) are
# installed at that root. Recalculate paths if content or mappings change; don't
# copy the screenshot's platform folders unless they exist in the installed layout.
# For this layout: Windows = Game.exe; Linux + SteamOS = Game. Confirm the build
# command actually produces those executables before recommending launch paths.
# Choose the matching OS and an appropriate Launch Type; use CPU Architecture Any
# unless restricted. Leave Arguments, Working Dir, Description, DLC, and Beta
# Branch blank unless needed. Build arguments are not game launch arguments.
# In Steamworks, set each OS-specific depot's OS and include it in the relevant
# app packages; this YAML configures neither depot settings nor launch options.
app_id: 3000000
targets:
  windows:
    depot_id: 3000001
    output: dist/windows/Game.exe
    build:
      command: [make, "steam-{target}", "OUTPUT={output}"]
      # These values are read by your build tool; they do not enable features automatically.
      env:
        GAME_EDITION: "full"
  linux:
    depot_id: 3000002
    output: dist/linux/Game
    build:
      command: [make, "steam-{target}", "OUTPUT={output}"]
